<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PaperWall3D</title>
    <meta name="description" content="Turn any image into a depth-aware 2.5D parallax 3D wallpaper. Runs entirely in your browser with on-device AI: your images never leave your device." />
    <meta name="theme-color" content="#0d0c14" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="PaperWall3D" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaperWall3D" />
    <meta property="og:title" content="PaperWall3D: 3D parallax wallpapers from any image" />
    <meta property="og:description" content="Depth-aware 2.5D parallax wallpapers powered by in-browser AI (segmentation + depth estimation) and Three.js. 100% client-side and private." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PaperWall3D" />
    <meta name="twitter:description" content="Turn any image into a depth-aware 3D parallax wallpaper, entirely in your browser." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <style>
      /* Pre-paint shell so there is never a white flash before the app mounts. */
      html, body { margin: 0; height: 100%; background: #0d0c14; color: #ecebf5; }
      #app { height: 100%; }
    </style>
  </head>
  <body>
    <noscript>
      <div style="font: 14px system-ui, sans-serif; padding: 32px; color: #ecebf5">
        <h1 style="font-size: 18px">PaperWall3D needs JavaScript</h1>
        <p>This app runs entirely in your browser (WebGL and WebAssembly) and cannot work with JavaScript disabled.</p>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
