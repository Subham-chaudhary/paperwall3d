<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>PaperWall3D</title>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#232323"/>
  <g filter="url(#s)">
    <!-- bottom sheet (blue, far) -->
    <path d="M9 40 32 52l23-12v-6L32 46 9 34z" fill="#2c4d85"/>
    <path d="M9 28 32 40l23-12v-6L32 34 9 22z" fill="#4772b3"/>
    <!-- top sheet peeling up (Blender orange, near) -->
    <path d="M32 9 55 21v6L32 39 9 27v-6z" fill="#ffa033"/>
    <path d="M32 9 9 21l23 12 23-12z" fill="#ffc678"/>
    <path d="M32 14 20 20.5l12 6.5 12-6.5z" fill="#ff8a00" opacity=".55"/>
    <!-- peeled corner -->
    <path d="M55 21 47 25.2 51 14z" fill="#fff" opacity=".28"/>
  </g>
</svg>
